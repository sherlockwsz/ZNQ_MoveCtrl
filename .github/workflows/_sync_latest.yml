name: temporary-sync-latest
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply uploaded PLC snapshot
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, tarfile
          payload = ''.join(open(f'.sync/p{i}', encoding='utf-8').read().strip() for i in range(1,6))
          data = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
              tf.extractall('.')
          PY
          rm -rf .sync
          rm -f .github/workflows/_sync_latest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sync latest ZNQ_MoveCtrl 2026-09-28"
          git push origin HEAD:main
